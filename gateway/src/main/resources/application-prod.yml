spring:
  application:
    name: gateway
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # 다른 서비스로 넘기는 요청의 연결 대기입니다. 기본 30초면 Eureka에 남은 죽은 인스턴스로 간 요청이 30초씩 붙잡히므로
            # 세션 확인 연결(2초)과 같게 둡니다. 응답 대기는 서비스별 처리 시간이 달라 제한하지 않습니다.
            connect-timeout: 2000
            pool:
              # 다른 서비스(Tomcat 기본)는 60초 쉰 연결을 닫음. 30초 넘게 쉰 연결은 다시 꺼낼 때 폐기해 닫히는 연결의 재사용을 줄임
              # 세션 확인 API 호출 연결도 같은 이유로 이 값을 씀(SessionVerificationConfiguration)
              max-idle-time: 30s
          metrics:
            enabled: true
          observability:
            enabled: true
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/v1/**]':
                # 실제 브라우저의 출처만 허용합니다. 변경 시 정확한 HTTPS 주소를 쉼표로 구분합니다.
                allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:https://travelpay.store,https://www.travelpay.store}
                allowed-methods: [GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE]
                allowed-headers: [Accept, Content-Type, Csrf-Token, Idempotency-Key]
                exposed-headers: [Request-Id, Location, Retry-After]
                allow-credentials: true
                max-age: 600
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/terms/**,/api/v1/users/**,/api/v1/admin/users/**,/api/v1/admin/terms/**
              metadata:
                # 세션 확인 API를 거치지 않는 User 라우트의 응답 헤더 대기 상한(밀리초, 넘으면 504). 숫자가 아니거나 비면 Gateway가 무시하므로 숫자로 고정
                # 정상 최대(부하 중 비밀번호 변경 약 0.7초)보다 길고, 대부분 User 안의 상한(DB 연결 획득·읽기·잠금 2초, 쓰기 5초, Redis 명령 2초)이 먼저 끝나게 10초
                response-timeout: 10000
            - id: wallet-service
              uri: lb://wallet-service
              predicates:
                - Path=/api/v1/wallets/**,/api/v1/charges/**,/api/v1/admin/charges/**
              filters:
                # 업무 서비스는 Gateway가 붙인 회원 헤더만 쓰므로 세션 쿠키를 넘기지 않음
                - RemoveRequestHeader=Cookie
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**,/api/v1/transfers/**,/api/v1/admin/payments/**,/api/v1/admin/transfers/**
              filters:
                - RemoveRequestHeader=Cookie
            - id: exchange-service
              uri: lb://exchange-service
              predicates:
                - Path=/api/v1/exchange-rates/**,/api/v1/exchange-limits/**,/api/v1/exchange-quotes/**,/api/v1/exchanges/**,/api/v1/exchange-reservations/**,/api/v1/admin/exchanges/**
              filters:
                - RemoveRequestHeader=Cookie

travelpay:
  gateway:
    session-verification:
      # user-service의 세션 확인 API. 주소의 user-service는 Eureka에서 찾는 서비스 이름
      uri: http://user-service/internal/v1/auth/session
      # User 서버에 연결하기까지의 대기 상한입니다.
      connect-timeout: ${GATEWAY_SESSION_VERIFICATION_CONNECT_TIMEOUT:2s}
      # 응답을 읽을 때 다음 데이터가 오기까지의 대기 상한입니다.
      response-timeout: ${GATEWAY_SESSION_VERIFICATION_RESPONSE_TIMEOUT:3s}
      # 연결 전 대기부터 응답 본문 해석까지 포함한 전체 상한입니다. 초과하면 503을 반환합니다.
      total-timeout: ${GATEWAY_SESSION_VERIFICATION_TOTAL_TIMEOUT:5s}
      protection:
        # 동시에 진행하는 세션 확인 호출 상한. 넘으면 기다리지 않고 바로 503(부하 시험의 최대 동시 요청 60건보다 여유 있게)
        max-concurrent-calls: 100
        # 최근 5초 호출이 20건 이상이고 그중 장애(503)가 50% 이상이면 서킷을 열어 2초 동안 세션 확인 없이 바로 503
        # 요청이 적을 때 장애 몇 건으로 열리지 않도록 최소 호출 수를 둠. 401·403·409 거절은 성공으로 셈
        # 장애 시험에서 10초 창은 직전 정상 호출에 묻혀 약 9초 뒤에 열렸고, 5초 열림은 회복을 5~6초 늦춰 둘 다 줄임
        failure-window: 5s
        minimum-calls: 20
        failure-rate-threshold: 50
        open-duration: 2s
        # 열린 뒤 회복을 판단하는 시험 호출 수. 이 중 장애가 50% 미만이면 닫힘
        half-open-calls: 5
    client-ip:
      # 이 대역에서 온 연결만 CF-Connecting-IP(Cloudflare가 넣는 실제 IP)를 믿음. 출처: https://www.cloudflare.com/ips/ (2026-11-02 확인)
      cloudflare-addresses:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
      # 배포 시 ALB→Gateway 연결에 쓰는 실제 ALB 서브넷 CIDR을 환경 변수로 지정
      # ALB는 Cloudflare에서만, Gateway는 ALB에서만 접근하도록 AWS 보안 그룹에서 제한
      proxy-addresses: ${GATEWAY_CLOUDFLARE_PROXY_ADDRESSES:}

server:
  port: 8080
  # ALB의 연결 주소를 유지하고, Cloudflare IP는 ClientIpResolver가 판단
  forward-headers-strategy: none

eureka:
  instance:
    hostname: gateway
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  tracing:
    propagation:
      # 외부 부모 trace는 추출하지 않고 Gateway에서 새 trace를 시작합니다.
      consume: []
      # 내부 호출에는 Gateway가 만든 W3C 추적 정보만 전달합니다.
      produce: [W3C]
    baggage:
      enabled: false
  server:
    # API와 다른 양수 고정 포트 사용(0 자동 할당 제외)
    port: ${GATEWAY_MANAGEMENT_PORT:18080}
    # 배포 시 이 포트는 ALB 헬스체크·Prometheus에서만 접근하도록 제한
    address: ${GATEWAY_MANAGEMENT_ADDRESS:0.0.0.0}
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
