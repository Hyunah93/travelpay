# 운영 Grafana 알림을 Slack으로 보냅니다. 송금·운영 알림 규칙은 받을 곳을 따로 정하지 않으므로 모두 아래 기본 정책을 따릅니다.
# Webhook 주소는 비밀값이라 이 파일에 두지 않습니다. prepare-monitoring.py가 Parameter Store의 SLACK_WEBHOOK_URL을
# Compose env_file로 넘기고, Grafana가 연락처 설정의 $SLACK_WEBHOOK_URL을 그 환경 변수로 바꿉니다.
# 알림 정책은 트리 전체가 하나의 자원이라 이 파일이 Grafana 화면에서 바꾼 정책을 덮어씁니다. 정책은 이 파일로만 바꿉니다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-monitoring
    receivers:
      - uid: slack-monitoring
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
        # 문제가 풀렸을 때도 알립니다.
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: slack-monitoring
    # Grafana 기본 묶음 기준입니다. 같은 규칙에 걸린 여러 서비스(예: 수집 중단)를 메시지 하나로 묶습니다.
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    # 해결되지 않은 알림은 4시간마다 다시 보냅니다.
    repeat_interval: 4h
