spring:
  application:
    name: exchange-service
  datasource:
    url: ${EXCHANGE_DB_URL}
    username: ${EXCHANGE_DB_USERNAME}
    password: ${EXCHANGE_DB_PASSWORD}
  flyway:
    default-schema: exchange_service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      # 환율 캐시·견적 저장소용 Redis(redis-cache 컨테이너, 내부 포트 6379)입니다. 세션 Redis와 다른 인스턴스입니다.
      host: ${REDIS_CACHE_HOST:redis-cache}
      port: ${REDIS_CACHE_PORT:6379}
      password: ${REDIS_CACHE_PASSWORD}
      # 명령 하나를 200ms까지만 기다리고 넘으면 DB로 조회한다. 빠지면 Lettuce 기본값(60초)이 되어
      # Redis가 멈췄을 때 환율 조회·견적 발급이 60초씩 붙잡힌다
      connect-timeout: 1s
      timeout: 200ms
      repositories:
        enabled: false
  task:
    scheduling:
      pool:
        # 기본 1스레드면 주문 복구가 길어질 때 환율 수집이 멈춘다. 수집과 복구가 서로 기다리지 않게 둘로 나눈다
        size: 2
  cloud:
    openfeign:
      client:
        config:
          # 한도 조회 응답을 오래 붙잡지 않도록 짧게. 실패하면 한도만 응답합니다.
          wallet-service:
            connect-timeout: 2000
            read-timeout: 3000
          # 원장 최대 응답(약 5초)까지 기다린다. 넘으면 결과 모름으로 두고 복구 스케줄러가 같은 요청을 다시 보낸다.
          # 배포는 이 파일만 읽으므로(SPRING_CONFIG_NAME=application-prod) 빠지면 OpenFeign 기본값(연결 10초, 읽기 60초)이 되어
          # 선점 유효 기간(10초)의 전제(원장 호출 최대 약 7초)가 깨진다
          ledger-service:
            connect-timeout: 2000
            read-timeout: 5000

travelpay:
  auth:
    header-context:
      enabled: true

exchange:
  rate:
    # 환율 수집 모드: koreaexim(한국수출입은행 공식 환율)
    mode: koreaexim
    koreaexim:
      api-key: ${KOREAEXIM_API_KEY:}
    # 최신 환율 캐시(Redis). false면 Redis를 쓰지 않고 모두 DB에서 읽는다
    cache:
      enabled: true
  quote:
    # 견적 유효 시간과 수수료율(0.01 = 1%)
    ttl: 5m
    fee-rate: 0.01
    # 견적 저장소 Redis 명령 대기 한도 (환율 캐시 200ms와 별도, #261)
    redis-timeout: 1s
    # 보내는 통화별 1회 금액 범위 (통화 단위, 팀 확정 전 임시값)
    limits:
      KRW:
        min: 1000
        max: 2000000
      JPY:
        min: 100
        max: 200000
      CNY:
        min: 10.00
        max: 10000.00
  order:
    # 결과를 모르는 주문의 복구(#317). application.yml과 같은 값을 둔다(이 파일만 읽으므로 빠지면 코드 기본값이 쓰임).
    # 5초마다 깨어나 batch-size건씩 가져와 처리하고 밀린 게 남았으면 time-budget까지 이어서 처리한다.
    # 적체 지표(30분 넘은 PROCESSING 수 등)는 backlog-refresh마다 따로 센다
    recovery:
      enabled: true
      fixed-delay: 5s
      batch-size: 50
      time-budget: 20s
      backlog-refresh: 30s
  ledger:
    # 원장 거래 등록 서킷 브레이커(#282). application.yml과 같은 값을 둔다.
    # 최근 10초 동안 20건 이상 호출됐고 절반 이상이 실패(시간 초과·연결 실패·5xx)이거나 2초 이상 걸리면 열고,
    # 10초 뒤 스스로 반열림으로 바뀌어 5건을 시험으로 보낸다
    circuit-breaker:
      sliding-window: 10s
      minimum-calls: 20
      failure-rate-percent: 50
      slow-call-duration: 2s
      slow-call-rate-percent: 50
      wait-in-open: 10s
      half-open-calls: 5
  reservation:
    # 예약 환전(#240). application.yml과 같은 값을 둔다. 최대 예약 기간과 회원당 동시 대기 예약 수
    max-period: 30d
    max-waiting-per-user: 10
    # 만료 시각이 지난 대기 예약을 EXPIRED로 바꾸는 주기와 한 배치 크기
    expiry:
      enabled: true
      fixed-delay: 1m
      batch-size: 500

server:
  port: 8080

eureka:
  instance:
    hostname: exchange-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  # HTTP 응답 시간 히스토그램(percentiles-histogram)은 application.yml(로컬)에만 켠다. 운영은 지표 저장 비용 때문에 팀 방침으로
  # 끄고, p95·p99 같은 측정은 로컬 모니터링 환경에서 본다
  health:
    redis:
      # 캐시 Redis가 꺼져도 DB로 조회해 서비스는 동작하므로, Redis 상태로 앱 health를 DOWN으로 만들지 않는다
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}

# API 문서는 운영에서 끕니다 (내부 구조를 외부에 드러내지 않게).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
